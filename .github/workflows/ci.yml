name: CI

# Every branch this crate is developed on, not just the one it lands on: work
# on a release branch has to meet the gates below before it is merged, not
# after.
on:
  push:
    branches:
      - main
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'release/**'
  pull_request:

# A force-push should not leave a stale run competing with the new one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Every job runs `scripts/check.sh <gate>`. The command strings live in that one
# file, so a local run is the same run as CI and neither can drift from the other.
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, "1.88"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: scripts/check.sh test

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The MSRV is a supported configuration, so it must lint clean too — a
        # stable-only clippy job lets a 1.88 break land silently.
        rust: [stable, "1.88"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - run: scripts/check.sh clippy

  deny:
    name: Advisories and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      # Without this, a RUSTSEC advisory against dashmap, rayon, boxcar or
      # num_enum would never surface here.
      - run: scripts/check.sh deny

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      # The gate pins `cargo +nightly fmt`: rustfmt.toml's group_imports and
      # imports_granularity are nightly-only, and a stable rustfmt ignores
      # unknown options and exits 0.
      - run: scripts/check.sh fmt

  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/check.sh doc

  doctest:
    name: Doctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/check.sh doctest

  # Fuzzing is deliberately not a CI job. Coverage-guided fuzzing only pays off
  # with an accumulated corpus, and a runner starts from an empty one every
  # time — a cold 60s campaign is little more than random input, at the cost of
  # a full ASan build per push. Fuzz locally instead:
  #
  #   cargo +nightly fuzz run --target x86_64-unknown-linux-gnu <validate|pipeline>
  #
  # --target is explicit because cargo-fuzz defaults to the triple it was itself
  # built for rather than the host, which breaks under a musl-built cargo-fuzz.

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: scripts/check.sh coverage
