name: Publish to crates.io

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required to mint the crates.io OIDC token
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # merge-base needs real history

      # A GitHub release can be cut from any commit, including one that never
      # landed on main. Publishing is restricted to release tags that are
      # actually contained in main.
      - name: Refuse releases not contained in main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main \
            || { echo "::error::release commit $GITHUB_SHA is not contained in main"; exit 1; }

      # The publish job runs the whole gate set, not just `cargo test`. A release
      # is the last point at which a broken --all-features build or a failing
      # docs.rs build (Cargo.toml sets all-features = true for docs.rs) can still
      # be caught, and it is the point at which it matters most.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt   # rustfmt.toml uses nightly-only options
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview
      - uses: taiki-e/install-action@cargo-deny
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: scripts/check.sh all

      # `cargo publish` deliberately stays in the workflow rather than moving
      # into check.sh: its token is minted per-run by the OIDC action below, and
      # a local `scripts/check.sh` invocation must not be able to publish.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
